apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-main
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kashifsayyad09/python-flask-three-tier.git
    path: frontend
    targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: microservices

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
